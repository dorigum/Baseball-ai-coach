plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.baseball.ai'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Spring AI 버전 명세 (Gemini API를 정식 지원하는 마일스톤 버전 지정)
ext {
    set('springAiVersion', "1.1.0-M1")
}

repositories {
    mavenCentral()
    // Spring AI Milestone Repository 추가
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // [수정] 구 버전 대신 Spring AI Google GenAI(Gemini) 공식 스타터 라이브러리로 변경 (버전 직접 기입으로 꼬임 해결)
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai:1.1.0-M1'
    
    // Firebase Admin SDK 의존성 주입 (소셜 로그인 토큰 검증용)
    implementation 'com.google.firebase:firebase-admin:9.2.0'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Spring AI 의존성 관리 BOM 매핑
dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
