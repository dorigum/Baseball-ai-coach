spring:
  application:
    name: baseball-ai-coach
  
  # [NEW] Spring AI Google Gemini API 설정
  ai:
    google:
      api-key: ${GEMINI_API_KEY}
      chat:
        options:
          model: gemini-1.5-flash
          temperature: 0.7
  
  # 기본 프로필: H2 인메모리 DB (설치 없이 바로 기동 및 로컬 테스트 가능)
  datasource:
    url: jdbc:h2:mem:baseballdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  username: sa
  password:
  driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

---
# MySQL 연동을 원할 경우 실행 시 -Dspring.profiles.active=mysql 옵션을 주거나 
# 아래 설정을 활성화하십시오.
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/baseballdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  username: root
  password: yourpassword
  driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
